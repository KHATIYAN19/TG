    <!-- ========================================
         META PIXEL
         Pixel ID: 965336112563401

         Initialize once here.

         PageView:
           Initial page loads handled here.
           React SPA navigation handled by
           MetaPageTracker.jsx.

         ViewContent / InitiateCheckout:
           Handled by metaPixel.js.

         Purchase:
           Handled by PaymentSuccess.jsx.

         IMPORTANT:
           Payment tokens must not be sent
           to Meta Pixel.
    ========================================= -->

    <script>
      (function () {
        "use strict";

        var PIXEL_ID = "965336112563401";

        // =====================================
        // DETECT SENSITIVE PAYMENT URLS
        // =====================================

        function isSensitivePaymentUrl() {
          var pathname =
            window.location.pathname.toLowerCase();

          var params = new URLSearchParams(
            window.location.search
          );

          var sensitivePaths = [
            "/payment/success",
            "/ebook/adk/payment/success"
          ];

          var sensitiveParameters = [
            "token",
            "access_token",
            "accesstoken",
            "download_token",
            "pdf"
          ];

          var sensitivePath =
            sensitivePaths.some(function (path) {
              return (
                pathname === path ||
                pathname.indexOf(path + "/") === 0
              );
            });

          var sensitiveQuery = false;

          params.forEach(function (_value, key) {
            if (
              sensitiveParameters.indexOf(
                key.toLowerCase()
              ) !== -1
            ) {
              sensitiveQuery = true;
            }
          });

          return sensitivePath || sensitiveQuery;
        }

        // =====================================
        // META PIXEL INITIALIZATION
        // =====================================

        !function(f,b,e,v,n,t,s) {
          if (f.fbq) return;

          n = f.fbq = function() {
            n.callMethod
              ? n.callMethod.apply(n, arguments)
              : n.queue.push(arguments);
          };

          if (!f._fbq) {
            f._fbq = n;
          }

          n.push = n;
          n.loaded = true;
          n.version = "2.0";
          n.queue = [];

          // Sales measurement is always on (see src/lib/consent.js): Facebook's script loads on every page
          // except pages whose URL carries a private access token.
          var loaded = false;
          f.__ttLoadMetaPixel = function () {
            if (loaded || isSensitivePaymentUrl()) return;
            loaded = true;
            t = b.createElement(e);
            t.async = true;
            t.src = v;
            s = b.getElementsByTagName(e)[0];
            s.parentNode.insertBefore(t, s);
          };

          f.__ttLoadMetaPixel();

        }(
          window,
          document,
          "script",
          "https://connect.facebook.net/en_US/fbevents.js"
        );

        // =====================================
        // REGISTER PIXEL
        // =====================================

        fbq("init", PIXEL_ID);

        // =====================================
        // INITIAL PAGE VIEW
        // =====================================

        // MetaPageTracker.jsx should handle
        // subsequent SPA navigations only.
        //
        // Skip pages with sensitive payment
        // credentials to avoid URL leakage.

        if (!isSensitivePaymentUrl()) {
          fbq("track", "PageView");
        }

        // =====================================
        // DEVELOPMENT DEBUGGING
        // =====================================

        var hostname = window.location.hostname;

        if (
          hostname === "localhost" ||
          hostname === "127.0.0.1"
        ) {
          console.log("[Meta Pixel] Initialized", {
            pixelId: PIXEL_ID,
            pageViewAllowed: !isSensitivePaymentUrl(),
            scriptLoadedWithConsent: Boolean(document.querySelector('script[src*="fbevents.js"]'))
          });
        }
      })();
    </script>

    <!-- ========================================
         END META PIXEL
    ========================================= -->
  </head>

  <body>

      src="/src/main.jsx"
    ></script>
